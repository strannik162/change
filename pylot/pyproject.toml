[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pylot"
version = "1.0.0"
description = "A DDNet (DDRaceNetwork) map completing bot written in pure Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC-BY-SA-4.0" }
authors = [{ name = "pylot contributors" }]
keywords = ["ddnet", "ddrace", "teeworlds", "bot", "physics", "pathfinding"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment :: Side-Scrolling/Arcade Games",
]

[project.scripts]
pylot = "pylot.cli:main"

[tool.setuptools]
packages = ["pylot"]

[tool.ruff]
line-length = 120
target-version = "py39"
